name: Build, Test & Release

on:
  push:
    branches: ["main"]
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Publish (linux-x64)
        run: >
          dotnet publish IrsEaser/IrsEaser.csproj
          --configuration Release
          --runtime linux-x64
          --self-contained true
          --output publish/linux-x64

      - name: Publish (win-x64)
        run: >
          dotnet publish IrsEaser/IrsEaser.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output publish/win-x64

      - name: Upload linux-x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: irs-easer-linux-x64
          path: publish/linux-x64/

      - name: Upload win-x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: irs-easer-win-x64
          path: publish/win-x64/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download linux-x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: irs-easer-linux-x64
          path: artifacts/linux-x64

      - name: Download win-x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: irs-easer-win-x64
          path: artifacts/win-x64

      - name: Create release archives
        run: |
          cd artifacts
          zip -r irs-easer-linux-x64.zip linux-x64/
          zip -r irs-easer-win-x64.zip win-x64/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/irs-easer-linux-x64.zip
            artifacts/irs-easer-win-x64.zip
